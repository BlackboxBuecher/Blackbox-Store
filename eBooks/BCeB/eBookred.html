<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Comedy – Blackbox Store Reader</title>
<!-- ePub.js und JSZip Bibliotheken -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<style>
  :root {
    --bg-main: #FFFFFF;
    --text-main: #1D1D1F;
    --text-muted: #86868B;
    --btn-bg: #E5E5EA;
    --btn-hover: #D1D1D6;
    --border: rgba(0, 0, 0, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .back-btn {
    background: var(--btn-bg);
    color: var(--text-main);
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }

  .back-btn:hover {
    background: var(--btn-hover);
  }

  .book-title {
    font-size: 14px;
    font-weight: 600;
  }

  .controls-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tool-btn {
    background: var(--btn-bg);
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-main);
    transition: background 0.2s;
  }

  .tool-btn:hover {
    background: var(--btn-hover);
  }

  main {
    flex: 1;
    width: 100%;
    height: 100%;
    position: relative;
    background: #FFFFFF;
  }

  #viewer {
    width: 100%;
    height: 100%;
    background: #FFFFFF;
  }

  footer {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .page-btn {
    background: var(--btn-bg);
    color: var(--text-main);
    border: none;
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }

  .page-btn:hover {
    background: var(--btn-hover);
  }

  #statusMsg {
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body oncontextmenu="return false;">

<header>
  <div class="nav-left">
    <a href="../../index.html" class="back-btn">← Zurück zum Store</a>
    <span class="book-title">Black Comedy – 50 geile Geschichten</span>
  </div>
  <div class="controls-right">
    <button class="tool-btn" id="decreaseFont">A-</button>
    <button class="tool-btn" id="increaseFont">A+</button>
  </div>
</header>

<main>
  <!-- Randloses Anzeigefenster ohne Kästen -->
  <div id="viewer"></div>
</main>

<footer>
  <button id="prevBtn" class="page-btn">← Vorherige Seite</button>
  <span id="statusMsg">Lade E-Book vom Server...</span>
  <button id="nextBtn" class="page-btn">Nächste Seite →</button>
</footer>

<script>
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'c', 'u'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft' && window.readerRendition) window.readerRendition.prev();
    if (e.key === 'ArrowRight' && window.readerRendition) window.readerRendition.next();
  });

  // Exakter Dateiname im selben Ordner
  const epubFileName = 'Black-Comedy-50-geile-Geschichten-Blackbox-Buecher.epub';
  const statusMsg = document.getElementById('statusMsg');
  let currentSize = 100;

  async function initReader() {
    try {
      statusMsg.textContent = 'Verbinde...';

      // Holt die Datei automatisch direkt vom Server-Pfad
      const response = await fetch(epubFileName);
      if (!response.ok) throw new Error('EPUB-Datei auf dem Server nicht gefunden.');
      
      const buffer = await response.arrayBuffer();
      
      statusMsg.textContent = 'Rendere Buch...';
      const book = ePub(buffer);
      
      window.readerRendition = book.renderTo("viewer", {
        width: "100%",
        height: "100%",
        spread: "auto"
      });

      // Schutz gegen Kopieren und Rechtsklick im Buch
      window.readerRendition.hooks.content.register(contents => {
        const doc = contents.document;
        doc.addEventListener('contextmenu', ev => ev.preventDefault());
        doc.body.style.userSelect = 'none';
        doc.body.style.webkitUserSelect = 'none';
      });

      await window.readerRendition.display();
      statusMsg.textContent = 'Bereit';

      document.getElementById('prevBtn').onclick = () => window.readerRendition.prev();
      document.getElementById('nextBtn').onclick = () => window.readerRendition.next();

      document.getElementById('decreaseFont').onclick = () => {
        if (currentSize > 80) {
          currentSize -= 10;
          window.readerRendition.themes.fontSize(currentSize + '%');
        }
      };

      document.getElementById('increaseFont').onclick = () => {
        if (currentSize < 150) {
          currentSize += 10;
          window.readerRendition.themes.fontSize(currentSize + '%');
        }
      };

    } catch (error) {
      console.error(error);
      statusMsg.textContent = 'Ladefehler: Bitte über einen Webserver aufrufen.';
    }
  }

  initReader();
</script>
</body>
</html>
