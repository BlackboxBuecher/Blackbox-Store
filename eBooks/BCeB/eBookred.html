<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackbox Store Black Comedy</title>
<!-- ePub.js und JSZip Bibliotheken -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<style>
  :root {
    --bg-main: #FFFFFF;
    --text-main: #1D1D1F;
    --btn-bg: #E5E5EA;
    --btn-hover: #D1D1D6;
    --border: rgba(0, 0, 0, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .back-btn {
    background: var(--btn-bg);
    color: var(--text-main);
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }

  .back-btn:hover {
    background: var(--btn-hover);
  }

  .book-title {
    font-size: 14px;
    font-weight: 600;
  }

  .controls-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tool-btn {
    background: var(--btn-bg);
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-main);
    transition: background 0.2s;
  }

  .tool-btn:hover {
    background: var(--btn-hover);
  }

  main {
    flex: 1;
    width: 100%;
    height: 100%;
    position: relative;
    background: #FFFFFF;
    overflow: hidden;
  }

  #viewer {
    width: 100%;
    height: 100%;
    background: #FFFFFF;
  }
</style>
</head>
<body oncontextmenu="return false;">

<header>
  <div class="nav-left">
    <a href="../../index.html" class="back-btn">← Zurück zum Store</a>
    <span class="book-title">Black Comedy – 50 geile Geschichten</span>
  </div>
  <div class="controls-right">
    <button class="tool-btn" id="printBtn" title="Gesamtes Buch drucken">Print</button>
  </div>
</header>

<main>
  <div id="viewer"></div>
</main>

<script>
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'c', 'u'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft' && window.readerRendition) window.readerRendition.prev();
    if (e.key === 'ArrowRight' && window.readerRendition) window.readerRendition.next();
  });

  const epubFileName = 'Black-Comedy-50-geile-Geschichten-Blackbox-Buecher.epub';
  let currentBook = null;

  async function initReader() {
    try {
      const response = await fetch(epubFileName);
      if (!response.ok) throw new Error('EPUB-Datei auf dem Server nicht gefunden.');
      
      const buffer = await response.arrayBuffer();
      currentBook = ePub(buffer);
      
      window.readerRendition = currentBook.renderTo("viewer", {
        width: "100%",
        height: "100%",
        spread: "auto"
      });

      window.readerRendition.hooks.content.register(contents => {
        const doc = contents.document;
        doc.addEventListener('contextmenu', ev => ev.preventDefault());
        doc.body.style.userSelect = 'none';
        doc.body.style.webkitUserSelect = 'none';

        // Touch- / Swipe-Erkennung direkt im Buch-Inhalt für flüssiges Wischen
        let startX = 0;
        doc.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
        }, { passive: true });

        doc.addEventListener('touchend', (e) => {
          let endX = e.changedTouches[0].clientX;
          let diff = startX - endX;
          if (Math.abs(diff) > 50) {
            if (diff > 0) {
              window.readerRendition.next();
            } else {
              window.readerRendition.prev();
            }
          }
        }, { passive: true });
      });

      await window.readerRendition.display();

    } catch (error) {
      console.error(error);
    }
  }

  // Print-Funktion
  document.getElementById('printBtn').addEventListener('click', async () => {
    if (!currentBook) return;

    try {
      await currentBook.ready;
      const spineItems = currentBook.spine.spineItems;
      let fullHtmlContent = '';

      for (const item of spineItems) {
        const doc = await item.load(currentBook.load.bind(currentBook));
        const bodyContent = doc.querySelector('body') ? doc.querySelector('body').innerHTML : '';
        fullHtmlContent += `<section class="print-chapter">${bodyContent}</section>`;
        item.unload();
      }

      const printFrame = document.createElement('iframe');
      printFrame.style.position = 'fixed';
      printFrame.style.right = '0';
      printFrame.style.bottom = '0';
      printFrame.style.width = '0';
      printFrame.style.height = '0';
      printFrame.style.border = '0';
      document.body.appendChild(printFrame);

      const frameDoc = printFrame.contentWindow.document;
      frameDoc.open();
      frameDoc.write(`
        <!DOCTYPE html>
        <html lang="de">
        <head>
          <meta charset="UTF-8">
          <title>Black Comedy – Druckansicht</title>
          <style>
            @page { margin: 20mm; }
            body { font-family: Georgia, serif; font-size: 12pt; line-height: 1.6; color: #000; }
            .print-chapter { page-break-after: always; }
            .print-chapter:last-child { page-break-after: auto; }
            img { max-width: 100%; height: auto; }
          </style>
        </head>
        <body>${fullHtmlContent}</body>
        </html>
      `);
      frameDoc.close();

      setTimeout(() => {
        printFrame.contentWindow.focus();
        printFrame.contentWindow.print();
        setTimeout(() => document.body.removeChild(printFrame), 2000);
      }, 500);

    } catch (err) {
      console.error(err);
    }
  });

  initReader();
</script>
</body>
</html>
